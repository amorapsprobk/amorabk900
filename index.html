<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMORABK / SHAHM - PS4 9.00 NO USB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .glow-bg {
      position: absolute;
      width: 450px; height: 450px;
      background: linear-gradient(45deg, #ff007f, #00f0ff);
      filter: blur(160px); border-radius: 50%; z-index: 1; opacity: 0.5;
    }
    .container {
      position: relative; z-index: 2;
      background: rgba(18, 22, 35, 0.9);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 0, 127, 0.4);
      border-radius: 24px; padding: 40px; text-align: center;
      box-shadow: 0 0 45px rgba(0, 240, 255, 0.2);
      max-width: 480px; width: 90%;
    }
    h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 0 12px #ff007f, 0 0 25px #ff007f;
      margin-bottom: 5px;
    }
    .subtitle { font-size: 1.1rem; color: #00f0ff; margin-bottom: 25px; font-weight: bold; }
    .btn-jb {
      background: linear-gradient(135deg, #ff007f, #00f0ff);
      border: none; padding: 18px 30px; font-size: 1.2rem;
      font-weight: bold; color: #fff; border-radius: 14px;
      cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      margin-bottom: 15px; width: 100%; text-transform: uppercase;
    }
    .status { font-size: 1.1rem; color: #00f0ff; margin-top: 15px; font-weight: bold; min-height: 35px; }
    .insta-box {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 0, 127, 0.3);
      padding: 10px 20px; border-radius: 30px; text-decoration: none;
      color: #ff007f; font-weight: 600; margin-top: 20px; font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="container">
    <h1>AMORABK / SHAHM</h1>
    <div class="subtitle">PS4 9.00 - No USB Host</div>
    
    <button class="btn-jb" id="jbBtn" onclick="runPSFree()">تفعيل الثغرة (بدون فلاشة)</button>
    <div class="status" id="statusText">جاهز للتشغيل</div>

    <br>
    <a href="https://instagram.com/amora_baker78" target="_blank" class="insta-box">
      📷 instagram: amora_baker78
    </a>
  </div>

  <script>
    function runPSFree() {
      var btn = document.getElementById('jbBtn');
      var status = document.getElementById('statusText');
      
      btn.style.display = 'none';
      status.innerText = "جاري تفعيل PSFree وبدون فلاشة، يرجى الانتظار...";

      var script = document.createElement('script');
      script.src = "https://kameleonps.github.io/900/psfree.js";
      script.onload = function() {
        status.innerText = "تم تفعيل الجيلبريك وGoldHEN بنجاح تام!";
      };
      script.onerror = function() {
        status.innerText = "حدث خطأ بالتحميل، حاول مرة أخرى.";
        btn.style.display = 'block';
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
